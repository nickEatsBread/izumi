[package]
name = "izumi"
version = "0.1.74"
description = "A native desktop anime client"
authors = ["izumi contributors"]
edition = "2021"
license = "AGPL-3.0-or-later"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "izumi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "izumi"
path = "src/main.rs"
# The binary is a two-line launcher with no tests. Skipping its empty harness also avoids
# linking the complete desktop UI runtime into a test executable that cannot test any logic.
test = false
bench = false

[build-dependencies]
tauri-build = { version = "=3.0.0-alpha.4", features = [] }
# Builds the Linux Widevine host shim (native/widevine/host.cc); unused on other targets.
cc = "1"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# The ignored live DRM-download test drives the async path; it needs the tokio test macro + runtime.
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# `tauri::test::mock_app()` lets the ignored live test drive the DRM command wrapper, not just its core.
tauri = { version = "=3.0.0-alpha.6", features = ["test"] }

# Size-optimized release build (shrinks the shipped native lib — the debug .so is ~163 MB of
# symbols/unoptimized code that never ships). strip drops symbols (big win, no runtime cost),
# lto + one codegen unit shrink and often speed up the output. Applies to desktop + android release.
[profile.release]
strip = true
lto = true
codegen-units = 1

# The desktop crate also emits Android-compatible static/cdylib artifacts in dev builds. Full
# symbols for that entire dependency graph can exceed 10 GiB on Windows before the final archive
# is written. Keep line tables for useful Izumi stack traces, omit dependency symbols, and avoid a
# second incremental-object cache; generated target files are also NTFS-compressed locally.
[profile.dev]
debug = 1
incremental = false

[profile.dev.package."*"]
debug = 0

[features]
# Optional alias retained for explicit mobile diagnostic builds. Shipped desktop builds enable
# Tauri's inspector through the target-specific dependency below.
devtools = ["tauri/devtools", "tauri-runtime-wry/devtools"]
# The "full" Android flavor: compile in the embedded libmpv player plugin (pulls the ~24 MB
# libmpv arm64 .so via the plugin's AAR). Omit it for the "lite" flavor (external player, small
# APK — today's default). Only meaningful on the Android target.
android-mpv = ["dep:tauri-plugin-mpv"]

[dependencies]
tauri = { version = "=3.0.0-alpha.6", features = [] }
tauri-plugin-opener = "=3.0.0-alpha.3"
# Platform/OS detection (used to branch behavior on Android vs desktop). Registered
# for all platforms.
tauri-plugin-os = "=3.0.0-alpha.3"
tauri-plugin-notification = "=3.0.0-alpha.3"
tauri-plugin-deep-link = "=3.0.0-alpha.3"
# In-tree plugin: launch an external Android video player via ACTION_VIEW (no-op on desktop).
tauri-plugin-extplayer = { path = "tauri-plugin-extplayer" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
regex = "1"
# rustls (not native-tls) so the whole HTTP stack cross-compiles for Android — native-tls needs
# OpenSSL, which has no Android target here.
tauri-plugin-http = { version = "=3.0.0-alpha.3", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["time", "fs", "io-util", "net", "sync", "process"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio-util = { version = "0.7", features = ["io"] }
anyhow = "1"
blake3 = "1"
getrandom = "0.3"
# Account-free device sync. Keep only the runtime features Izumi uses: relay-capable
# TLS, NAT traversal, persistent storage, and gossip networking. The upstream
# defaults also enable metrics, RPC servers, and legacy database migration code.
iroh = { version = "1.0", default-features = false, features = ["tls-ring", "portmapper"] }
iroh-docs = { version = "0.101", default-features = false, features = ["fs-store"] }
iroh-blobs = { version = "0.103", default-features = false, features = ["fs-store"] }
iroh-gossip = { version = "0.101", default-features = false, features = ["net"] }
# The higher-level mDNS lookup only multicasts on the OS default interface. Use
# swarm-discovery directly so multi-homed PCs also query their Wi-Fi/LAN adapters.
swarm-discovery = "0.6"
netwatch = "0.19"
# Adapter enumeration for the Direct P2P VPN binding (friendly names, interface types). Same
# crate + version netwatch already builds, promoted to a direct dependency.
netdev = "0.45"
data-encoding = "2.11"
n0-future = "0.3"
# Offline downloads: stream a resolved debrid URL to disk (pure reqwest GET — no
# webview http-scope, no plugin-fs). rustls-tls for the same Android cross-compile reason.
# Compress metadata/HTML over the wire and transparently decode it before the existing body-size
# guard. Reqwest deliberately omits Accept-Encoding on Range requests, so resumable media/file
# downloads keep byte-for-byte range semantics.
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "http2", "charset", "cookies", "gzip", "brotli", "multipart", "json"] }
futures-util = "0.3"
# Decrypting DRM downloads: produce a clear, offline-watchable MP4 instead of storing encrypted
# segments plus a persistent licence. `widevine` runs the L3 licence exchange (device/challenge/
# keys); `aes`+`ctr`+`cipher` implement AES-CTR for CENC sample decryption; `data-encoding` decodes
# the base64 pssh box. All pure Rust, so the Android target keeps cross-compiling (the command is
# desktop-only at runtime). GPL-3.0 `widevine` is compatible with this crate's AGPL-3.0-or-later.
widevine = "0.1"
aes = "0.8"
ctr = "0.9"
cipher = "0.4"
# The Widevine device pool (widevine_device.rs): `hmac` signs the gated pool requests (with the
# `sha2` below), `rsa` parses the published PEM key so the `.wvd` is assembled in memory. Both are
# the versions `widevine` already pulls in, so nothing new enters the tree.
hmac = "0.12"
rsa = "0.9"
# Signed `.izumi-ext` packages are installed on desktop and Android. These are all pure-Rust
# dependencies; keeping them cross-platform lets Android verify exactly the same hashes,
# signatures, archive bounds, and manifest ABI before an extension APK can reach the runtime.
zip = { version = "4", default-features = false, features = ["deflate-flate2-zlib-rs"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
sha2 = "0.10"
base64 = "0.22"
ed25519-dalek = { version = "3.0.0-rc.0", features = ["pkcs8"] }
# Decode bounded, manually-streamed metadata/HTML bodies using the response charset. This keeps
# the old reqwest `Response::text()` behaviour after adding a strict pre-allocation body ceiling.
encoding_rs = "0.8"
# Subtitle downloads are normalized on desktop and Android before libmpv sees them.
chardetng = "0.1"
# Native file dialog — pick the external-player executable. Linux uses the XDG portal: the
# default GTK 3 dialog cannot load beside CEF's GTK 4.
tauri-plugin-dialog = { version = "=3.0.0-alpha.4", default-features = false, features = ["xdg-portal"] }
url = "2"
# Embedded BitTorrent engine. Its read-only localhost HTTP endpoint supports
# byte ranges, so mpv can seek while only the selected episode is downloaded.
# It comes from upstream's main branch plus izumi's patches, vendored by the block at the end of
# this file: read vendor/README.md before touching it.
librqbit = { version = "9.0.1", default-features = false, features = ["rust-tls", "http-api", "tracing-subscriber-utils"] }

# Native-player + desktop-only deps, EXCLUDED from the Android build (which delegates playback to
# an external app): libmpv (no Android target here), the scrub-thumbnail image codec (its only
# consumer is the gated player), and the updater plugin (no Android/app-store updater support).
[target.'cfg(not(target_os = "android"))'.dependencies]
# The About > Diagnostics action must also work in production. Keep the feature desktop-only:
# Android's WebView cannot open an in-app inspector (it requires Chrome remote inspection), and
# enabling it unconditionally would make every release APK remotely debuggable over ADB.
tauri = { version = "=3.0.0-alpha.6", features = ["devtools"] }
libmpv2 = "6.0.0"
libmpv2-sys = "4.0.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tauri-plugin-updater = "=3.0.0-alpha.3"
tauri-plugin-window-state = "=3.0.0-alpha.2"
souvlaki = "0.8.3"
discord-rich-presence = "1.1.0"
tauri-plugin-single-instance = { version = "=3.0.0-alpha.3", features = ["deep-link"] }
# Direct-API subtitle providers (OpenSubtitles/SubDL). SubDL delivers subtitles as ZIP archives
# that Rust must unzip (first .srt/.ass), and every downloaded body needs charset detection +
# decode to UTF-8 before mpv can load it. All pure-Rust: `zip` with the zlib-rs deflate backend
# (no C toolchain), `chardetng` guesses the legacy encoding, `encoding_rs` decodes it.
tar = "0.4"
realfft = "3"
# Desktop Google Cast sender. Cast receivers advertise through DNS-SD and accept the CastV2
# protocol over TLS on the advertised port. The web sender SDK is unavailable inside Tauri's
# embedded webviews, so desktop performs discovery and the media LOAD handshake natively.
mdns-sd = { version = "0.21", default-features = false }
rust_cast = "0.21"
rustls = "0.23"
# Samsung and other smart TVs expose the standard UPnP MediaRenderer description over SSDP.
# quick-xml keeps device-description and SOAP status parsing bounded without a DOM dependency.
quick-xml = "0.39"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
# Embedded libmpv player for the Android "full" flavor (optional; see the `android-mpv` feature).
tauri-plugin-mpv = { path = "tauri-plugin-mpv", optional = true }
# In-process GIF recording. The desktop recorder pipes mpv's JPEG frames through the user's ffmpeg;
# Android has none, so the same palette + LZW encode runs here. Both are pure Rust (zune-jpeg decode,
# NeuQuant quantization via the gif crate's color_quant), so they cross-compile with no C toolchain.
image = { version = "0.25", default-features = false, features = ["jpeg"] }
gif = "0.13"
# UI-wide haptics (impact/notification/selection). Android/iOS only; no desktop haptics engine,
# so it is never compiled into the desktop/Deck builds. Registered unconditionally on mobile.
tauri-plugin-haptics = "=3.0.0-alpha.3"

[target.'cfg(target_os = "android")'.dependencies]
# Reqwest's rustls backend verifies certificates through Android's system trust store. Its
# verifier must be initialized from a JVM-owned thread before Tauri starts any async networking.
jni = "0.22.4"
rustls-platform-verifier = "0.7.0"

# Raw Win32 for true borderless fullscreen + mpv-child input passthrough, and the
# WebView2 COM call to make the webview background transparent (Stremio's model:
# opaque window + transparent webview). windows 0.62 + webview2-com 0.39 match
# wry 0.57's own versions (Tauri 3) so the `with_webview` controller interface unifies.
[target.'cfg(windows)'.dependencies]
# librqbit uses AWS-LC's legacy SHA-1 implementation for torrent piece hashes.
# Bundle NASM for Windows builders instead of requiring a system installation.
aws-lc-rs = { version = "1.17.3", features = ["prebuilt-nasm"] }
# Loads Google's Widevine module (widevinecdm.dll) for the pure-Rust CDM host (src/widevine/).
# Linux links a C++ shim through the CDM ABI instead (see build.rs); Windows cannot, so the host
# vtable is built in Rust and the module is opened at runtime.
libloading = "0.8"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Devices_Display",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  # Keep extension services tied to Izumi even when a dev rebuild terminates the host.
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  # SetThreadExecutionState — keep the display + system awake while a video plays.
  "Win32_System_Power",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
] }
webview2-com = "0.39"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", features = ["NSGeometry", "NSString", "NSValue"] }
objc2-app-kit = { version = "0.3.2", features = [
  "NSScreen",
  "objc2-core-foundation",
  "NSView",
  "NSWindow",
  "NSResponder",
  "NSGraphics",
  "NSOpenGL",
  "NSOpenGLView",
] }

# Windows (WebView2), macOS (WKWebView) and Android (system WebView) keep the wry runtime.
[target.'cfg(not(target_os = "linux"))'.dependencies]
tauri-runtime-wry = { version = "=3.0.0-alpha.6" }

[target.'cfg(not(any(target_os = "android", target_os = "linux")))'.dependencies]
tauri-runtime-wry = { version = "=3.0.0-alpha.6", features = ["devtools"] }

# Linux runs the CEF runtime with the main webview offscreen. player/linux_cef.rs draws it, with
# mpv's video under it (libmpv's render API), into one X11 child window from its own EGL render
# thread. CEF brings GTK 4, so nothing GTK 3 (WebKitGTK, gtk 0.18, rfd's GTK dialog) may link.
[target.'cfg(target_os = "linux")'.dependencies]
tauri-runtime-cef = { version = "=3.0.0-alpha.7", features = ["devtools"] }
# The window-event types tauri-runtime-cef hands `on_window_event`.
winit = { version = "0.31.0-beta.3", package = "tauri-winit", default-features = false }
# GLib on CEF's UI thread: the focus keepalive and the idle-spin fix in linux_cef.rs.
gtk4 = { version = "0.11", default-features = false }
x11-dl = "2.21"
libc = "0.2"
gl = "0.14"
khronos-egl = { version = "6", features = ["dynamic"] }
raw-window-handle = "0.6"
# Steam Deck controller: the Deck's (Steam-virtual) pad is read in Rust and forwarded to the page
# as `gamepad-input` events (see gamepad_linux.rs). gilrs handles enumeration + Xbox mapping.
gilrs = "0.11"
# Steam Deck Flatpak auto-update: prefer org.freedesktop.portal.Flatpak UpdateMonitor to detect +
# install a pending OSTree update. Older SteamOS portals fall back to a host Flatpak command (the
# manifest grants org.freedesktop.Flatpak for that path). `tokio` matches our async commands;
# `flatpak` gates the UpdateMonitor API. Uses the same zbus 5 as the rest of the tree.
ashpd = { version = "0.13", default-features = false, features = ["tokio", "flatpak", "inhibit"] }

# BEGIN librqbit-vendor: written by scripts/ci/librqbit-vendor.mjs from src-tauri/vendor/upstream.json.
# These crates are upstream git revisions, some with izumi patches, that crates.io does not have
# yet. vendor/README.md explains how to update them. Edit upstream.json, not this block.
[patch.crates-io]
librqbit = { path = "vendor/librqbit" }
librqbit-lsd = { path = "vendor/librqbit-lsd" }
librqbit-utp = { path = "vendor/librqbit-utp" }
# END librqbit-vendor

# `widevine` is vendored (0.1.0) for one behavioural fix the licence server requires: an Android
# request id must be the OEMCrypto uppercase-hex *string* (32 bytes), not the 16 raw bytes, or the
# request is refused. See vendor/widevine/README.vendor.md. The request also goes out with a plain
# client id — Crunchyroll refuses Privacy Mode with these devices.
widevine = { path = "vendor/widevine" }
