name: release

# Tag-driven releases, all hosted on GitHub Releases:
#   v1.2.3         -> stable release  (updater "stable" channel = releases/latest)
#   v1.2.3-beta.1  -> rolling "beta" pre-release (updater "beta" channel)
#
# Any tag containing "-" is a beta: it is published to a single, rolling `beta`
# pre-release (overwritten each time) so the updater's beta endpoint stays static at
# .../releases/download/beta/latest.json.
on:
  push:
    tags:
      - 'v*'
  # Manual fallback: run from the Actions tab (or `gh workflow run release.yml --ref vX.Y.Z`)
  # with the TAG as the ref. Dispatch runs are created via the API, so they still work when
  # GitHub's push-event webhooks are throttled/dropped (which has swallowed tag builds before).
  workflow_dispatch:

# One release build at a time. A beta run STARTS by deleting the rolling `beta` release, so two
# concurrent runs destroy each other's uploads (every attach dies with "release not found") — seen
# 2026-08-06 when throttled tag-push events drained late on top of a manual dispatch. Queuing
# (not cancelling) means a duplicate event just rebuilds the same release afterwards, harmlessly.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

# These OAuth values identify public desktop applications; no client secret is shipped. GitHub
# variables keep deployment values centralized and out of both the repository and build scripts.
env:
  PUBLIC_ANILIST_CLIENT_ID: ${{ vars.ANILIST_CLIENT_ID }}
  PUBLIC_MAL_CLIENT_ID: ${{ vars.MAL_CLIENT_ID }}
  PUBLIC_SIMKL_CLIENT_ID: ${{ vars.SIMKL_CLIENT_ID }}
  PUBLIC_OAUTH_REDIRECT_URI: ${{ vars.OAUTH_REDIRECT_URI }}
  PUBLIC_DISCUSS_ANIME_API_KEY: ${{ secrets.DISCUSS_ANIME_API_KEY }}

jobs:
  create-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_id: ${{ steps.create.outputs.result }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - name: Resolve channel + target tag
        id: meta
        run: |
          if [[ "${{ github.ref_name }}" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "tag=beta" >> "$GITHUB_OUTPUT"          # rolling beta tag
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Delete previous rolling beta release (beta only)
        if: steps.meta.outputs.prerelease == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete beta --repo "${{ github.repository }}" --yes --cleanup-tag || true

      # Full history + tags so the notes can list every commit since the previous release.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Build the release body: the download blurb + a bulleted list of the commits since the
      # previous tag. This repo lands changes as direct commits (not PRs), so GitHub's own
      # auto-generated notes would be empty — we generate the list from `git log` instead.
      - name: Build changelog
        id: changelog
        run: |
          cur="${{ github.ref_name }}"
          # Compare against the previous STABLE tag (exclude pre-releases like v1.2.3-beta.1),
          # so a stable release lists everything since the last stable — not just since the
          # last beta — and a beta lists the full set of changes it carries over that stable.
          prev="$(git describe --tags --abbrev=0 --exclude '*-*' "${cur}^" 2>/dev/null || true)"
          if [ -n "$prev" ]; then range="${prev}..${cur}"; else range="$cur"; fi
          echo "changelog range: ${range}"
          log="$(git log --no-merges --pretty=format:'- %s (%h)' "$range")"
          [ -n "$log" ] || log='- No changes recorded.'
          {
            echo 'body<<CHANGELOG_EOF'
            echo 'Download an installer for your platform below. The app auto-updates.'
            echo ''
            echo '## Changes'
            echo "$log"
            if [ -n "$prev" ]; then
              echo ''
              echo "**Full changelog:** https://github.com/${{ github.repository }}/compare/${prev}...${cur}"
            fi
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create draft release
        id: create
        uses: actions/github-script@v9
        env:
          # Passed via env (not string-interpolated into the script) so commit messages with
          # quotes/backticks can't break the JS.
          RELEASE_BODY: ${{ steps.changelog.outputs.body }}
        with:
          script: |
            const tag = '${{ steps.meta.outputs.tag }}';
            const pre = ${{ steps.meta.outputs.prerelease }};
            const pushed = context.ref.replace('refs/tags/', '');
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: pre ? `izumi beta (${pushed})` : `izumi ${tag}`,
              body: process.env.RELEASE_BODY,
              draft: true,
              prerelease: pre,
            });
            return data.id;

  build:
    needs: create-release
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            args: ''
          - platform: windows-latest
            args: '--config {"bundle":{"resources":["libmpv-2.dll"]}}'
          - platform: macos-14        # Apple Silicon (arm64) — unsigned .dmg
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # GitHub isolates caches by tag: vX.Y.Z cannot restore a cache saved by vX.Y.(Z-1).
      # Restore the release-profile dependency cache warmed by the default-branch CI job, and do
      # not waste time uploading another cache that only this tag could ever reuse.
      - name: Rust cache (Windows release)
        if: matrix.platform == 'windows-latest'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: windows-release
          save-if: false

      - name: Rust cache
        if: matrix.platform != 'windows-latest'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          # A tag cache is isolated from every future tag. Restoring main is useful; uploading
          # another ~800 MB cache at the end of every release only evicts reusable caches.
          save-if: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # libmpv2-sys links `-l mpv`, so libmpv must be on the linker path.
      - name: libmpv + Tauri deps (Linux)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          bash scripts/ci/libmpv-linux.sh
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libepoxy-dev \
            libappindicator3-dev \
            libudev-dev \
            librsvg2-dev \
            patchelf

      # Windows: libmpv2-sys links `-l mpv` (needs mpv.lib) and the app needs
      # libmpv-2.dll at runtime. Set up MSVC (lib.exe), then run the shared setup script.
      # A maintained fork of ilammy/msvc-dev-cmd, which stalled on the Node 20 runtime (last
      # release 2024-01, open node24 issue, several unmerged PRs). Unlike the original it has no
      # implicit host arch: without `arch` it exports nothing and fails the step, so pass x64
      # explicitly to match the x86_64 libmpv build the script fetches.
      - name: Setup MSVC (lib.exe)
        if: matrix.platform == 'windows-latest'
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      # Shared with pr-build.yml so the two cannot drift — see scripts/ci/libmpv-windows.ps1.
      - name: libmpv (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pwsh -File scripts/ci/libmpv-windows.ps1

      # macOS: libmpv2-sys links `-l mpv`; Homebrew provides libmpv + headers. But a user's Mac has
      # no Homebrew, and brew's libmpv hardcodes /opt/homebrew load paths and pulls a large dep tree
      # (ffmpeg / libass / libplacebo). So: rewrite libmpv's install-name id to @rpath so the app
      # records a RELOCATABLE load path, then dylibbundler copies libmpv + ALL its non-system deps
      # into a Frameworks staging dir (each id rewritten to @rpath). Those get bundled into the .app
      # (frameworks list below) and resolved at runtime via an @executable_path/../Frameworks rpath.
      # Unsigned (no Apple Developer cert): the bundler ad-hoc signs; users right-click > Open once.
      - name: libmpv + dylib bundling (macOS)
        if: startsWith(matrix.platform, 'macos')
        run: |
          set -euo pipefail
          brew update
          brew install mpv ffmpeg dylibbundler
          mpv_version="$(mpv --version | sed -n '1p')"
          echo "$mpv_version"
          grep -Eq '^mpv v?0\.(4[1-9]|[5-9][0-9])' <<<"$mpv_version"
          BREW="$(brew --prefix)"
          echo "PKG_CONFIG_PATH=$BREW/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$BREW/lib" >> "$GITHUB_ENV"
          # Runtime search path for the dylibs bundled under the app's Frameworks folder.
          echo "RUSTFLAGS=-C link-arg=-Wl,-rpath,@executable_path/../Frameworks" >> "$GITHUB_ENV"
          # Record a relocatable load path in the app instead of /opt/homebrew/...
          chmod +w "$BREW/lib/libmpv.2.dylib"
          install_name_tool -id @rpath/libmpv.2.dylib "$BREW/lib/libmpv.2.dylib"
          # Stage libmpv + its recursive non-system deps with @rpath ids for bundling.
          STAGE="$GITHUB_WORKSPACE/src-tauri/macos-frameworks"
          mkdir -p "$STAGE"
          cp "$BREW/lib/libmpv.2.dylib" "$STAGE/"
          chmod +w "$STAGE/libmpv.2.dylib"
          dylibbundler -of -b -x "$STAGE/libmpv.2.dylib" -d "$STAGE" -p "@rpath/"
          # Finder-launched apps do not inherit Homebrew's PATH. Ship a relocatable ffmpeg beside
          # the app resources so GIF capture works on a clean Mac, and bundle/rewrite every one of
          # its non-system dylibs into the same Frameworks directory as libmpv.
          TOOL="$GITHUB_WORKSPACE/src-tauri/macos-tools/ffmpeg"
          mkdir -p "$(dirname "$TOOL")"
          cp "$(command -v ffmpeg)" "$TOOL"
          chmod u+w,+x "$TOOL"
          dylibbundler -of -b -x "$TOOL" -d "$STAGE" -p "@rpath/"
          install_name_tool -add_rpath "@executable_path/../Frameworks" "$TOOL"
          # Compact JSON (NO spaces — survives tauri-action splitting args on spaces) listing every
          # staged dylib for Tauri's macOS `frameworks` bundler. Consumed by the build step's args.
          FW="$(python3 -c "import glob,json;print(json.dumps(sorted(glob.glob('$STAGE/*.dylib')),separators=(',',':')))")"
          echo "MAC_ARGS=--config {\"bundle\":{\"resources\":{\"macos-tools/ffmpeg\":\"ffmpeg\"},\"macOS\":{\"frameworks\":$FW}}}" >> "$GITHUB_ENV"

      - name: Install JS deps
        run: npm ci

      - name: Build + upload to release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # From `npm run tauri signer generate`; store as repo secrets.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          uploadUpdaterJson: true
          # macOS injects the dynamically-built frameworks list (MAC_ARGS) from the bundling step.
          args: ${{ startsWith(matrix.platform, 'macos') && env.MAC_ARGS || matrix.args }}

      - name: Publish native player capability manifest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          name="player-capabilities-${RUNNER_OS,,}-${RUNNER_ARCH,,}.json"
          args=(--platform "${RUNNER_OS,,}-${RUNNER_ARCH,,}" --output "$name")
          case "$RUNNER_OS" in
            Windows)
              args+=(--artifact src-tauri/libmpv-2.dll)
              args+=(--windows-script scripts/ci/libmpv-windows.ps1)
              ;;
            macOS)
              args+=(--artifact src-tauri/macos-frameworks/libmpv.2.dylib)
              args+=(--mpv auto --ffmpeg src-tauri/macos-tools/ffmpeg --pkg-config true)
              ;;
            Linux)
              args+=(--artifact "$(pkg-config --variable=libdir mpv)/libmpv.so.2")
              args+=(--pkg-config true)
              ;;
          esac
          node scripts/ci/player-capability-manifest.mjs "${args[@]}"
          tag="${{ github.ref_name }}"; [[ "$tag" == *-* ]] && tag=beta
          gh release upload "$tag" "$name" --repo "${{ github.repository }}" --clobber

      # Upload version-less COPIES beside Tauri's versioned artifacts, so the README can link
      # permanent /releases/latest/download/<name> URLs that never change — GitHub-native, no
      # third party, no README edits per release. The versioned files stay; these are extra copies.
      - name: Publish stable-named copies
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          tag="${{ github.ref_name }}"; [[ "$tag" == *-* ]] && tag=beta   # betas publish to the rolling `beta` release
          B=src-tauri/target/release/bundle
          # copy <glob> <stable-name>: nullglob means only THIS runner's platform bundles match.
          copy() { local m=($1); [ ${#m[@]} -gt 0 ] || return 0; cp "${m[0]}" "$2"; gh release upload "$tag" "$2" --repo "${{ github.repository }}" --clobber; }
          copy "$B/nsis/*-setup.exe"     izumi-x64-setup.exe
          copy "$B/msi/*.msi"           izumi-x64.msi
          copy "$B/dmg/*.dmg"           izumi-aarch64.dmg
          copy "$B/appimage/*.AppImage" izumi-x86_64.AppImage
          copy "$B/deb/*.deb"           izumi-amd64.deb
          copy "$B/rpm/*.rpm"           izumi-x86_64.rpm

      - name: Verify bundled macOS GIF encoder
        if: startsWith(matrix.platform, 'macos')
        run: |
          set -euo pipefail
          FFMPEG="src-tauri/target/release/bundle/macos/izumi.app/Contents/Resources/ffmpeg"
          test -x "$FFMPEG"
          "$FFMPEG" -hide_banner -version
          if otool -L "$FFMPEG" | grep -q '/opt/homebrew'; then
            echo 'Bundled ffmpeg still references Homebrew' >&2
            otool -L "$FFMPEG" >&2
            exit 1
          fi

  cleanup-release-signatures:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Remove standalone updater signature assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api --paginate \
            "/repos/${{ github.repository }}/releases/${{ needs.create-release.outputs.release_id }}/assets" \
            --jq '.[] | select(.name | endswith(".sig")) | [.id, .name] | @tsv' |
          while IFS=$'\t' read -r id name; do
            [ -n "$id" ] || continue
            echo "Deleting $name"
            gh api -X DELETE "/repos/${{ github.repository }}/releases/assets/$id"
          done

  # The Steam Deck build is a Flatpak (NOT the desktop-Linux deb/rpm/AppImage above): SteamOS is
  # immutable and its system libs clash with a bundled AppImage (white screen), so the Deck uses the
  # GNOME runtime's matched webkit/gtk/mesa/pipewire. Built here the same way as locally, attached to
  # the release as its own asset. Runs independently of `build`, so a hiccup here never blocks the
  # desktop release; it just uploads the Deck bundle when ready.
  flatpak:
    needs: create-release
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    # Flathub publishes this purpose-built image with GNOME 49 Platform + SDK already installed.
    # Pulling it through GHCR is bounded and observable; downloading the SDK from Flathub inside
    # the job took 30 minutes without progress in v0.1.47-10.
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      # The base image has the GNOME runtime/SDK. The manifest's much smaller Node extension is the
      # only extra ref; install it system-wide so it is visible to the system flatpak-builder.
      - name: Install Node SDK extension
        run: |
          set -euo pipefail
          flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install -y --noninteractive flathub org.freedesktop.Sdk.Extension.node22//25.08

      # Stable tag `vX.Y.Z` -> that tag; any pre-release (`-`) -> the rolling `beta` release.
      - name: Resolve release tag
        id: meta
        run: |
          if [[ "${{ github.ref_name }}" == *-* ]]; then
            echo "tag=beta" >> "$GITHUB_OUTPUT"
            echo "branch=beta" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "branch=stable" >> "$GITHUB_OUTPUT"
          fi

      - name: Import Flatpak signing key
        run: |
          # Import the signing key + export a BINARY public key FIRST, so build-bundle can bake an
          # update ORIGIN into the .flatpak itself (--repo-url) plus the key that verifies it
          # (--gpg-keys). That's what lets a DIRECT `.flatpak` install (not just the .flatpakref)
          # `flatpak update` from Pages afterwards — the bundle is no longer install-only.
          echo "${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}" | gpg --batch --import
          gpg --export ${{ secrets.FLATPAK_GPG_KEY_ID }} > flatpak/izumi-key.gpg

      - name: Build the Steam Deck app
        working-directory: flatpak
        run: |
          set -euxo pipefail
          # Export only after flatpak-builder has staged the `type: dir` source. Creating `_repo`
          # first would make the repository copy itself into the app's source tree.
          flatpak-builder --force-clean --ccache --disable-rofiles-fuse \
            --default-branch="${{ steps.meta.outputs.branch }}" \
            _build com.nicho.izumi.yml
          flatpak build-export \
            --no-update-summary \
            --gpg-sign=${{ secrets.FLATPAK_GPG_KEY_ID }} \
            _repo _build "${{ steps.meta.outputs.branch }}"

      # Before this release split, every Deck build used Flatpak's implicit `master` branch.
      # On the next stable release, keep a signed compatibility ref in the stable repository so
      # the redirect below can move existing installs without opting them into beta releases.
      - name: Preserve legacy master installs
        if: steps.meta.outputs.branch == 'stable'
        run: |
          set -euxo pipefail
          branch="${{ steps.meta.outputs.branch }}"
          arch="$(flatpak --default-arch)"
          app="com.nicho.izumi"
          repo="flatpak/_repo"
          flatpak build-commit-from \
            --src-ref="app/$app/$arch/$branch" \
            --no-update-summary \
            --gpg-sign=${{ secrets.FLATPAK_GPG_KEY_ID }} \
            "$repo" "app/$app/$arch/master"

          debug_src="runtime/$app.Debug/$arch/$branch"
          if ostree --repo="$repo" rev-parse "$debug_src" >/dev/null 2>&1; then
            flatpak build-commit-from \
              --src-ref="$debug_src" \
              --no-update-summary \
              --gpg-sign=${{ secrets.FLATPAK_GPG_KEY_ID }} \
              "$repo" "runtime/$app.Debug/$arch/master"
          fi

      - name: Create the Steam Deck bundle
        working-directory: flatpak
        run: |
          set -euxo pipefail
          flatpak build-bundle _repo \
            "../izumi-${{ steps.meta.outputs.tag }}-steamdeck.flatpak" \
            com.nicho.izumi \
            "${{ steps.meta.outputs.branch }}" \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo \
            --repo-url=https://flatpak.izumi.watch/${{ steps.meta.outputs.branch }}/ \
            --gpg-keys=izumi-key.gpg

      # Turn the channel repo into a real, GPG-verified update ORIGIN published on GitHub Pages, so
      # BOTH the `.flatpakref` install and the direct `.flatpak` bundle (which now bakes in this same
      # origin, above) can `flatpak update` from it. Commits were signed during export above; this
      # signs the summary and generates deltas. The minisign updater key is separate.
      - name: Finalize the channel OSTree repo
        run: |
          set -euxo pipefail
          flatpak build-update-repo flatpak/_repo \
            --default-branch="${{ steps.meta.outputs.branch }}" \
            --generate-static-deltas \
            --gpg-sign=${{ secrets.FLATPAK_GPG_KEY_ID }}
          gpg --export --armor ${{ secrets.FLATPAK_GPG_KEY_ID }} > flatpak/_repo/izumi.gpg

      # The one-file install descriptor users open on the Deck. Embeds the repo URL + the base64
      # GPG public key so `flatpak install <url>/com.nicho.izumi.flatpakref` trusts the origin.
      - name: Emit the .flatpakref
        run: |
          set -euxo pipefail
          # Keep the presentation metadata in the ref as well as AppStream. Discover and other
          # software centres can render this immediately, before they have downloaded the repo's
          # AppStream catalogue; without it their fallback is the raw Name (com.nicho.izumi).
          branch="${{ steps.meta.outputs.branch }}"
          remote_name=izumi
          [[ "$branch" == "beta" ]] && remote_name=izumi-beta
          install -Dm644 src-tauri/icons/128x128.png flatpak/_repo/com.nicho.izumi.png
          cat > flatpak/_repo/com.nicho.izumi.flatpakref <<EOF
          [Flatpak Ref]
          Version=1
          Name=com.nicho.izumi
          Branch=${{ steps.meta.outputs.branch }}
          SuggestRemoteName=$remote_name
          Title=izumi
          Comment=Controller-first desktop anime client
          Description=Stream anime with a controller-first interface, native mpv playback, AniList and MyAnimeList tracking, and Stremio-addon sourcing.
          Icon=https://flatpak.izumi.watch/${{ steps.meta.outputs.branch }}/com.nicho.izumi.png
          Homepage=https://github.com/nickEatsBread/izumi
          Url=https://flatpak.izumi.watch/${{ steps.meta.outputs.branch }}/
          GPGKey=$(base64 -w0 flatpak/_repo/izumi.gpg)
          IsRuntime=false
          RuntimeRepo=https://flathub.org/repo/flathub.flatpakrepo
          EOF
          cp flatpak/_repo/com.nicho.izumi.flatpakref \
            "izumi-${{ steps.meta.outputs.tag }}-steamdeck.flatpakref"

      # Existing installs point at the old root URL and `master`. A signed repository redirect
      # moves that remote to stable, where the compatibility ref above lives. Beta releases must
      # never rewrite this default/legacy origin and silently opt existing users into prereleases.
      - name: Create the legacy-origin redirect
        if: steps.meta.outputs.branch == 'stable'
        run: |
          set -euxo pipefail
          ostree --repo=flatpak/_legacy_repo init --mode=archive-z2
          flatpak build-update-repo flatpak/_legacy_repo \
            --default-branch=master \
            --redirect-url="https://flatpak.izumi.watch/stable/" \
            --gpg-sign=${{ secrets.FLATPAK_GPG_KEY_ID }}

      # Publish stable and beta as independent repositories. This keeps one channel's summary from
      # hiding the other channel's branch and avoids downloading the multi-gigabyte Pages history
      # into every release job. Replacing only the selected destination also bounds repository size;
      # the other channel is untouched by actions-gh-pages' destination_dir behavior.
      - name: Publish the channel OSTree repo to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./flatpak/_repo
          destination_dir: ${{ steps.meta.outputs.branch }}

      - name: Redirect legacy Flatpak installs to the channel repo
        if: steps.meta.outputs.branch == 'stable'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./flatpak/_legacy_repo
          keep_files: true
          cname: flatpak.izumi.watch

      - name: Attach the Flatpak to the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          draft: true
          files: |
            izumi-*.flatpak
            izumi-*.flatpakref
          fail_on_unmatched_files: true

  # Android APK (arm64), signed with the release keystore so the in-app self-updater can
  # install it over a previous build. Runs independently of `build` (a hiccup here never
  # blocks the desktop release); attaches the signed APK to the same release. The Android
  # updater finds it via the GitHub Releases API (no updater signature / latest.json needed).
  android:
    needs: create-release
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # Two flavors: `lite` (external player, ~12 MB) and `full` (embedded libmpv, ~36 MB). Both are
    # signed with the same release key so the in-app updater can install either over a prior build;
    # the updater picks the asset matching the running flavor (see src/lib/updater/android.ts).
    strategy:
      fail-fast: false
      matrix:
        flavor: [lite, full]
    env:
      NDK_VERSION: "29.0.14206865"
      BUILD_TOOLS: "36.0.0"
    steps:
      - uses: actions/checkout@v7

      - name: Resolve release tag
        id: meta
        run: |
          if [[ "${{ github.ref_name }}" == *-* ]]; then
            echo "tag=beta" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK + platform + build-tools
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}" "platforms;android-36" "build-tools;${BUILD_TOOLS}"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Rust + Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          # Both flavors can reuse the release-profile dependency graph warmed on trusted main.
          # Never save from a tag: caches are tag-scoped, so the next version cannot read them.
          shared-key: android-release
          save-if: false

      - name: Install JS deps
        run: npm ci

      - name: Cache secure libmpv build
        if: matrix.flavor == 'full'
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/izumi-libmpv-android
          key: libmpv-android-arm64-f77f62c316c6-${{ hashFiles('scripts/ci/libmpv-android.sh') }}

      - name: Restore Gradle cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-${{ hashFiles('src-tauri/Cargo.lock', 'scripts/ci/android-scaffold.sh') }}
          restore-keys: gradle-android-

      - name: Build libmpv with libass 0.17.5
        if: matrix.flavor == 'full'
        run: bash scripts/ci/libmpv-android.sh

      # libass on Android can only use a real font file, and the app's webfont copy of Nunito is
      # woff2. Stage the upstream OFL TTF into the mpv plugin's assets so the subtitle appearance
      # settings can actually resolve izumi's default font (see scripts/fetch-subtitle-font.mjs).
      # Only the full flavor compiles the plugin, but staging for both keeps the step trivial.
      - name: Stage the subtitle font
        run: |
          set -euo pipefail
          npm run fonts:subtitle
          test -s src-tauri/tauri-plugin-mpv/android/src/main/assets/fonts/Nunito.ttf

      # `gen/android` is regenerated by `tauri android init`, so flavor-specific project tweaks are
      # applied here (they can't be committed). Full needs Kotlin ≥2.2 to read the libmpv AAR's
      # metadata + the PiP flag; its Tauri config opts into the matching mpv capability below.
      # Shared with pr-build.yml so the two cannot drift — see scripts/ci/android-scaffold.sh.
      - name: Configure flavor + scaffold Android project
        run: bash scripts/ci/android-scaffold.sh ${{ matrix.flavor }}

      - name: Build Android APK (arm64, ${{ matrix.flavor }})
        run: |
          if [ "${{ matrix.flavor }}" = "full" ]; then
            npx tauri android build --apk --target aarch64 --features android-mpv --config src-tauri/tauri.android-mpv.conf.json
          else
            npx tauri android build --apk --target aarch64
          fi

      - name: Sign the APK with the release keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          BT="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}"
          UNSIGNED="$(find src-tauri/gen/android -path '*release*' -name '*-unsigned.apk' | head -1)"
          if [ -z "$UNSIGNED" ]; then echo "no unsigned APK produced"; exit 1; fi
          OUT="izumi-${{ steps.meta.outputs.tag }}-android-arm64-${{ matrix.flavor }}.apk"
          "$BT/zipalign" -f -P 16 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass "pass:$KS_PASS" \
            --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASS" --out "$OUT" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --verbose "$OUT"
          READELF="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          bash scripts/ci/verify-android-native.sh "$OUT" "$BT/zipalign" "$READELF"
          rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/aligned.apk"

      - name: Attach the APK to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          T="${{ steps.meta.outputs.tag }}"
          VER="izumi-$T-android-arm64-${{ matrix.flavor }}.apk"
          MANIFEST="player-capabilities-$T-android-arm64-${{ matrix.flavor }}.json"
          args=(--platform "android-arm64-${{ matrix.flavor }}" --output "$MANIFEST" --artifact "$VER")
          if [ "${{ matrix.flavor }}" = "full" ]; then
            args+=(--artifact src-tauri/tauri-plugin-mpv/android/libs/libmpv.aar)
            args+=(--android-script scripts/ci/libmpv-android.sh)
            args+=(--media3-gradle src-tauri/tauri-plugin-mpv/android/build.gradle.kts)
          fi
          node scripts/ci/player-capability-manifest.mjs "${args[@]}"
          gh release upload "$T" "$VER" --repo "${{ github.repository }}" --clobber
          gh release upload "$T" "$MANIFEST" --repo "${{ github.repository }}" --clobber
          # Version-less copy for the README's permanent /latest/download link (versioned one stays).
          cp "$VER" "izumi-android-${{ matrix.flavor }}.apk"
          gh release upload "$T" "izumi-android-${{ matrix.flavor }}.apk" --repo "${{ github.repository }}" --clobber

  publish-release:
    # Keep the release draft if any shipped platform fails its build or validation gates.
    needs: [create-release, build, flatpak, android, cleanup-release-signatures]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish the release (un-draft)
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false,
              prerelease: ${{ needs.create-release.outputs.prerelease }},
            });
