name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: this workflow only reads the tree to type-check, test and build. Without an
# explicit block the job inherits the repo default, which can be write — an unnecessary token
# for a workflow that runs third-party build tooling over pull-request code.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: libmpv + Tauri deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libmpv-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libepoxy-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install JS deps
        run: npm ci

      - name: svelte-check
        run: npm run check

      - name: Unit tests
        if: ${{ !cancelled() }}
        run: npm test

      - name: Build frontend
        if: ${{ !cancelled() }}
        run: npm run build

      - name: cargo check
        if: ${{ !cancelled() }}
        working-directory: src-tauri
        run: cargo check

      # Full test run: in-crate #[cfg(test)] units AND the integration tests. This was
      # `cargo test --test extension_package` for a while, which silently skipped every
      # in-crate test (~60 of them) on every CI run.
      - name: Rust tests
        if: ${{ !cancelled() }}
        working-directory: src-tauri
        run: cargo test

  # Cross-platform compile coverage. `check` above is thorough but runs only on Linux, so anything
  # that broke the Windows, macOS or Android build stayed invisible until a tag was pushed and the
  # release matrix failed on it — which is how a linux_embed.rs change once shipped having never
  # compiled. A per-target `cargo check` closes that in a couple of minutes.
  #
  # NOT covered here: the Android Kotlin plugins. Their sources only compile inside the
  # `tauri android init` scaffold (gen/ is gitignored and regenerated per run), so building them
  # means building the whole APK — that lives in pr-build.yml, which produces an installable one.
  compile:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            name: windows
          - platform: macos-14
            name: macos (arm64)
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Tag-scoped release runs can read caches from the default branch, but not from a previous
      # tag. Keep a release-profile dependency cache warm on trusted main pushes so Windows
      # releases do not cold-compile the entire Rust dependency graph for every version.
      - name: Rust cache (Windows release)
        if: matrix.platform == 'windows-latest'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: windows-release
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Rust cache
        if: matrix.platform != 'windows-latest'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: compile-${{ matrix.name }}

      # A release-profile cache only helps `tauri build` if it contains linked `.rlib` dependency
      # artifacts. `cargo check` produces debug-profile metadata, so warm the useful cache on main.
      # Pull requests retain the cheap compile-only coverage below.
      - name: Setup MSVC (lib.exe)
        if: matrix.platform == 'windows-latest' && github.event_name == 'push'
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: libmpv (Windows release cache)
        if: matrix.platform == 'windows-latest' && github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pwsh -File scripts/ci/libmpv-windows.ps1

      - name: Warm Windows release cache
        if: matrix.platform == 'windows-latest' && github.event_name == 'push'
        working-directory: src-tauri
        run: cargo build --release

      # `cargo check` never links, so the import lib / dylib that libmpv2-sys asks the LINKER for is
      # not needed here — only the crate's own build script has to succeed. That keeps this job at
      # "does it compile" speed instead of re-running the release job's libmpv staging.
      - name: cargo check
        if: matrix.platform != 'windows-latest' || github.event_name != 'push'
        working-directory: src-tauri
        run: cargo check

  # Android is its own job: the target needs the NDK's C toolchain (ring/aws-lc build scripts
  # invoke a cross clang), and the embedded-player code behind `android-mpv` is the half most
  # likely to break — it is invisible to every other job in this file.
  compile-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      # r28+ emits 16 KiB-aligned ELF LOAD segments by default. Match the pinned libmpv build.
      NDK_VERSION: "29.0.14206865"
      BUILD_TOOLS: "36.0.0"
      PUBLIC_DISCUSS_ANIME_API_KEY: ${{ secrets.DISCUSS_ANIME_API_KEY }}
      PUBLIC_SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup JDK 21
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install Android release tools
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: sdkmanager --install "platforms;android-36" "build-tools;${BUILD_TOOLS}"

      - name: Setup Node
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Rust + Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      # Main produces the only cache scope that future tags and PRs can read. Build the real full
      # APK there, so both release flavors restore optimized Android artifacts instead of spending
      # ~10 minutes compiling the same Rust graph twice per tag.
      - name: Rust cache (Android release)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: android-release
          save-if: true

      - name: Rust cache (Android check)
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: compile-android

      # The API level in the clang wrapper's name must match minSdkVersion (26, tauri.conf.json).
      # Without CC_*/AR_* the ring build script fails looking for `aarch64-linux-android-clang`.
      - name: cargo check (aarch64, android-mpv)
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        working-directory: src-tauri
        run: |
          set -euo pipefail
          BIN="$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$BIN/aarch64-linux-android26-clang" || { echo "NDK clang not at $BIN"; exit 1; }
          export CC_aarch64_linux_android="$BIN/aarch64-linux-android26-clang"
          export AR_aarch64_linux_android="$BIN/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$BIN/aarch64-linux-android26-clang"
          cargo check --target aarch64-linux-android --features android-mpv

      - name: Install JS deps
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm ci

      - name: Cache secure libmpv build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache@v6
        with:
          path: ~/.cache/izumi-libmpv-android
          key: libmpv-android-arm64-f77f62c316c6-${{ hashFiles('scripts/ci/libmpv-android.sh') }}

      - name: Build libmpv with libass 0.17.5
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: bash scripts/ci/libmpv-android.sh

      - name: Cache Gradle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-${{ hashFiles('src-tauri/Cargo.lock', 'scripts/ci/android-scaffold.sh') }}
          restore-keys: gradle-android-

      - name: Stage the subtitle font
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          npm run fonts:subtitle
          test -s src-tauri/tauri-plugin-mpv/android/src/main/assets/fonts/Nunito.ttf

      - name: Configure full Android build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: bash scripts/ci/android-scaffold.sh full

      - name: Warm Android release caches
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx tauri android build --apk --target aarch64 --features android-mpv --config src-tauri/tauri.android-mpv.conf.json
