name: Publish stable Worker

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare-sync-worker/src/**'
      - 'cloudflare-sync-worker/migrations/**'
      - 'cloudflare-sync-worker/package*.json'
      - 'cloudflare-sync-worker/wrangler.jsonc'
      - 'src-tauri/src/cloudflare_worker_bundle.mjs'
      - 'scripts/package-cloudflare-release.mjs'
      - 'scripts/publish-cloudflare-release.mjs'
      - '.github/workflows/worker-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stable-worker-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'nickEatsBread/izumi' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci --prefix cloudflare-sync-worker
      - name: Verify the shipped Worker
        run: |
          node scripts/build-cloudflare-direct-upload.mjs --check
          npm run paraglide
          npx svelte-kit sync
          npx vitest run cloudflare-sync-worker/tests --maxWorkers 2
          npm run check --prefix cloudflare-sync-worker
      - name: Package and publish the stable feed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VERSION=$(node -p 'JSON.parse(require("fs").readFileSync("cloudflare-sync-worker/package.json")).version')
          node scripts/package-cloudflare-release.mjs "worker-v$VERSION"
          # Published releases are immutable, so changed Worker sources under an already-published
          # version bump themselves here instead of failing the publication after the merge. A
          # bounded loop, because the next patch version can itself be published already when an
          # earlier run bumped past this run's checkout.
          bumped=0
          for attempt in 1 2 3 4 5 6; do
            decision=0
            node scripts/worker-release-needs-bump.mjs || decision=$?
            if [ "$decision" -eq 1 ]; then break; fi
            if [ "$decision" -ne 0 ]; then exit "$decision"; fi
            if [ "$attempt" -eq 6 ]; then echo 'Giving up after five automatic Worker version bumps.'; exit 1; fi
            NEW=$(node scripts/bump-cloudflare-worker.mjs)
            node scripts/package-cloudflare-release.mjs "worker-v$NEW"
            bumped=1
          done
          if [ "$bumped" -eq 1 ]; then
            git config user.name "nickEatsBread"
            git config user.email "nickEatsBread@users.noreply.github.com"
            git add cloudflare-sync-worker/package.json cloudflare-sync-worker/package-lock.json \
              cloudflare-sync-worker/src/index.js src/lib/sync/cloudflare.ts \
              src-tauri/src/cloudflare_worker_bundle.mjs
            git commit -m "chore: release Worker v$NEW"
            git pull --rebase origin main
            # A rebase that pulled further Worker changes would desynchronize the packaged bundle;
            # refuse to push a stale artifact — a rerun (or the next Worker change) publishes it.
            node scripts/build-cloudflare-direct-upload.mjs --check
            git push origin HEAD:main
          fi
          GITHUB_SHA=$(git rev-parse HEAD) node scripts/publish-cloudflare-release.mjs
