<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Nuvio" fill="none">
  <style>
    /* Loaded through an img element, so this document cannot inherit the page colour. It gets its
       own colour-scheme evaluation instead, which is how the other marks in this folder cope. */
    .plate { fill: #1c1d22; fill-opacity: .1 }
    .glyph { stroke: #1c1d22 }
    @media (prefers-color-scheme: dark) {
      .plate { fill: #f2f2f5; fill-opacity: .14 }
      .glyph { stroke: #f2f2f5 }
    }
  </style>
  <rect class="plate" width="32" height="32" rx="8"/>
  <path class="glyph" d="M11 22V10l10 12V10" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
