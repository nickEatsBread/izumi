<!doctype html>
<!-- Inline dark bg so the very first paint (before the JS bundle + app.css load) matches the app's
     background instead of flashing white on launch. app.css/+layout override this at runtime (incl.
     the transparent player hole). Value = --background (240 10% 3.9%). -->
<html lang="en" style="background:#0a0a0b">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <!-- viewport-fit=cover so env(safe-area-inset-*) resolves non-zero on Android edge-to-edge
         (status-bar / gesture-area insets); without it the mobile safe-area padding is a no-op. -->
    <!-- maximum-scale=1 + user-scalable=no: lock out the WebView's native pinch / double-tap zoom.
         Without it, rapid taps while navigating on mobile register as a double-tap and zoom the page
         (which then stays zoomed). The app has its own UI-scale setting; browser zoom isn't wanted. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>izumi</title>
    <!-- A pack's startup animation plays at launch: paint black from the first frame so Home never
         shows before it. The keys are kept by src/lib/startup/animation.ts. -->
    <style>html.startup-cover::after{content:'';position:fixed;inset:0;z-index:2147483646;background:#000}</style>
    <!-- A launch that is slow to show anything (a cold start, a startup animation still loading) gets a
         spinner after 0.7 s, above that cover; it goes once the app is up and nothing covers it. -->
    <style>
      #boot-wait{position:fixed;left:50%;top:50%;z-index:2147483647;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:rgba(255,255,255,.85);opacity:0;pointer-events:none;animation:boot-wait-in .2s .7s forwards,boot-wait-spin .9s linear infinite}
      html.booted:not(.startup-cover) #boot-wait{display:none}
      @keyframes boot-wait-in{to{opacity:1}}
      @keyframes boot-wait-spin{to{transform:rotate(360deg)}}
    </style>
    <script>
      try {
        var store = window.localStorage, info = store.getItem('startup-animation-info-v1')
        if (location.pathname.indexOf('/app') === 0 && info && info !== 'null'
          && store.getItem('startup-animation-enabled-v1') !== 'false'
          && store.getItem('motion-preference') !== '"reduce"'
          && !window.sessionStorage.getItem('startup-animation-played')
          && !(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches)) {
          document.documentElement.classList.add('startup-cover')
        }
      } catch (e) { /* storage blocked: no cover, the app starts as usual */ }
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div id="boot-wait" role="progressbar" aria-label="Starting izumi"></div>
    <!-- A pack's startup animation starts here, before any app code has loaded (Rust's launch script
         names the video), so a launch opens on it; StartupAnimation.svelte takes it over from here.
         Shown even while Game mode hides the page until its zoom is applied. -->
    <script>
      (function () {
        var url = window.__IZUMI_STARTUP_URL__
        if (!url || !document.documentElement.classList.contains('startup-cover')) return
        var video = document.createElement('video')
        video.id = 'boot-intro'
        video.muted = true
        video.playsInline = true
        video.preload = 'auto'
        video.setAttribute('style', 'position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#000;z-index:2147483647;visibility:visible')
        video.src = url
        document.body.appendChild(video)
        var started = video.play()
        if (started && started.catch) started.catch(function () {})
      })()
    </script>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
